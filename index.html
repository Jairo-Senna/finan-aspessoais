<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Finanças</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#000;--card:#0a0f0b;--tx:#e8f5ec;--mut:#7f9a89;--bd:#1b2b20;--pri:#22c55e;--inc:#22c55e;--exp:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
#login{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
*{box-sizing:border-box}
html{background:#000;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:0 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
header button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;width:40px;height:40px;font-size:18px}
#mes{font-weight:600;text-transform:capitalize}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.saldo{font-size:32px;font-weight:700}
.row{display:flex;gap:12px}.row>div{flex:1}
.mut{color:var(--mut);font-size:13px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.donut{width:180px;height:180px;border-radius:50%;margin:8px auto 16px;position:relative}
.cat{display:flex;align-items:center;gap:8px;padding:6px 0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{height:6px;border-radius:3px;background:var(--bd);margin-top:4px;overflow:hidden}.bar i{display:block;height:100%}
.cat>div:nth-child(2){flex:1}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.tx:last-child{border:0}.tx>div:nth-child(2){flex:1;min-width:0}
.tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del,.fd{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:160px;background:none;border:0;color:var(--mut);padding:10px 4px;font-size:14px;border-radius:10px}
nav button.on{color:var(--pri);font-weight:600;background:var(--bg)}
#fab{position:fixed;right:20px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--pri);color:#000;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
dialog{border:0;border-radius:20px;padding:20px;width:calc(100% - 32px);max-width:420px;background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.seg button.on.e{background:var(--exp);color:#fff;border-color:var(--exp)}.seg button.on.i{background:var(--inc);color:#000;border-color:var(--inc)}
.save{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--pri);color:#000;font-size:16px;font-weight:600}
.vazio{text-align:center;color:var(--mut);padding:24px 0}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:90%;line-height:1.45}.msg.u{background:var(--pri);color:#000;margin-left:auto}.msg.m{background:var(--bg);border:1px solid var(--bd)}
#msgs{max-height:48vh;overflow:auto}.sg{background:none;border:1px solid var(--bd);color:var(--pri);border-radius:16px;padding:6px 10px;font-size:13px;margin:4px 4px 0 0}
</style>
</head>
<body>
<div id="login"><h1 style="color:var(--pri);margin:0">Minhas Finanças</h1><div class="mut">Controle de receitas e gastos</div><button class="save" id="entrar" style="max-width:280px">Entrar com Google</button><div id="lmsg" class="mut"></div></div>
<div id="app" hidden>
<header><button id="prev" aria-label="Mês anterior">‹</button><span id="mes"></span><button id="next" aria-label="Próximo mês">›</button></header>
<main id="view"></main>
<button id="fab" aria-label="Novo lançamento">+</button>
<nav><button id="t1" class="on">Resumo</button><button id="t2">Lançamentos</button><button id="t3">Assistente</button><button id="sair">Sair</button></nav>

</div>
<dialog id="dlg">
  <div class="seg"><button id="bE" class="on e" type="button">Despesa</button><button id="bI" class="i" type="button">Receita</button></div>
  <label>Valor (R$)</label><input id="val" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
  <label>Categoria</label><select id="cat"></select>
  <div id="srcw" hidden><label>Empresa / fonte</label><select id="src"></select></div>
  <div id="fxh" class="mut" hidden style="margin-top:6px">Repete todo mês. Nos próximos meses vem zerado para você informar o valor. Use a descrição como nome (ex.: Energia).</div>
  <label>Data</label><input id="dt" type="date">
  <label>Descrição (opcional)</label><input id="ds" type="text" maxlength="60">
  <button class="save" id="salvar" type="button">Salvar</button>
  <button class="save" id="cancelar" type="button" style="background:none;color:var(--mut);margin-top:4px">Cancelar</button>
</dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,doc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const CATS={e:{"Alimentação":"#f97316","Moradia":"#6366f1","Transporte":"#0ea5e9","Saúde":"#ef4444","Lazer":"#a855f7","Educação":"#eab308","Compras":"#ec4899","Gastos fixos":"#475569","Outros":"#94a3b8"},
i:{"Salário":"#22c55e","Freelance":"#14b8a6","Investimentos":"#3b82f6","Outros":"#94a3b8"}};
const $=id=>document.getElementById(id);
const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tx=[];try{tx=JSON.parse(localStorage.getItem("fin.tx")||"[]")}catch(e){}
let ref=null,unsub=null;
const push=()=>{if(ref)setDoc(ref,{tx,srcs,fix}).catch(e=>console.error(e))};
const save=push;
let srcs=[],fix=[];try{srcs=JSON.parse(localStorage.getItem("fin.src")||"[]");fix=JSON.parse(localStorage.getItem("fin.fix")||"[]")}catch(e){}
const PAL=["#16a34a","#2563eb","#d97706","#9333ea","#0891b2","#e11d48"];
const save2=push;
const colorOf=(ty,k)=>ty=="i"&&srcs.includes(k)?PAL[srcs.indexOf(k)%PAL.length]:(CATS[ty][k]||"#94a3b8");
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let mes=hoje().slice(0,7),aba=1,tipo="e";

function render(){
  const [y,m]=mes.split("-");
  $("mes").textContent=new Date(y,m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  const L=tx.filter(t=>t.date.startsWith(mes)).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const rec=L.filter(t=>t.type=="i").reduce((s,t)=>s+t.amount,0);
  const des=L.filter(t=>t.type=="e").reduce((s,t)=>s+t.amount,0);
  let h="";const pend=fix.filter(f=>f.start<=mes&&!L.some(t=>t.fixId==f.id));
  if(aba==1){
    h+=`<div class="card"><div class="mut">Saldo do mês</div><div class="saldo ${rec-des<0?"exp":""}">${brl(rec-des)}</div>
    <div class="row" style="margin-top:12px"><div><div class="mut">Receitas</div><b class="inc">${brl(rec)}</b></div><div><div class="mut">Despesas</div><b class="exp">${brl(des)}</b></div></div></div>`;
    if(pend.length)h+=`<div class="card" style="border-color:var(--exp)"><b>${pend.length} gasto(s) fixo(s) sem valor neste mês</b><div class="mut">Informe na aba Lançamentos.</div></div>`;
    [["e","Gastos por categoria",des,"Nenhuma despesa neste mês."],["i","Receitas por fonte",rec,"Nenhuma receita neste mês."]].forEach(([ty,tit,tot,vz])=>{
    const by={};L.filter(t=>t.type==ty).forEach(t=>{const k=ty=="i"?(t.src||t.cat):t.cat;by[k]=(by[k]||0)+t.amount});
    const ks=Object.keys(by).sort((a,b)=>by[b]-by[a]);
    h+=`<div class="card"><b>${tit}</b>`;
    if(!ks.length)h+=`<div class="vazio">${vz}</div>`;
    else{
      let acc=0;const stops=ks.map(k=>{const a=acc/tot*100;acc+=by[k];return `${colorOf(ty,k)} ${a}% ${acc/tot*100}%`}).join(",");
      h+=`<div class="donut" style="background:conic-gradient(${stops})"></div>`;
      ks.forEach(k=>{const p=by[k]/tot*100,c=colorOf(ty,k);
        h+=`<div class="cat"><span class="dot" style="background:${c}"></span><div><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><span>${brl(by[k])} <span class="mut">${p.toFixed(0)}%</span></span></div><div class="bar"><i style="width:${p}%;background:${c}"></i></div></div></div>`});
    }
    h+=`</div>`;
    });
  }else if(aba==3){
    h+=chatHtml();
  }else{
    if(pend.length){h+=`<div class="card"><b>Gastos fixos a preencher</b><div class="mut">Toque em Informar para lançar o valor do mês</div>`;
      pend.forEach(f=>{h+=`<div class="tx"><span class="dot" style="background:${CATS.e["Gastos fixos"]}"></span><div><b>${esc(f.name)}</b><span class="mut">R$ 0,00 · pendente</span></div><button class="fx" data-id="${f.id}" style="border:1px solid var(--pri);color:var(--pri);background:none;border-radius:8px;padding:6px 10px">Informar</button><button class="fd" data-id="${f.id}" aria-label="Parar de repetir">✕</button></div>`});
      h+=`</div>`}
    h+=`<div class="card">`;
    if(!L.length)h+=`<div class="vazio">Nenhum lançamento neste mês.<br>Toque em + para adicionar.</div>`;
    L.forEach(t=>{const c=colorOf(t.type,t.type=="i"?(t.src||t.cat):t.cat),d=t.date.split("-");
      h+=`<div class="tx"><span class="dot" style="background:${c}"></span><div><b>${esc(t.desc||t.cat)}</b><span class="mut">${esc(t.src||t.cat)} · ${d[2]}/${d[1]}</span></div><b class="${t.type=="i"?"inc":"exp"}">${t.type=="i"?"+":"−"}${brl(t.amount)}</b><button class="del" data-id="${t.id}" aria-label="Excluir">✕</button></div>`});
    h+=`</div>`;
  }
  $("view").innerHTML=h;
  $("fab").hidden=aba==3;
  if(aba==3)bindChat();
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{if(confirm("Excluir este lançamento?")){tx=tx.filter(t=>t.id!=b.dataset.id);save();render()}});
  document.querySelectorAll(".fx").forEach(b=>b.onclick=()=>{const f=fix.find(x=>x.id==b.dataset.id);const r=prompt("Valor de "+f.name+" em "+$("mes").textContent+" (R$):");if(r===null)return;let s=r.trim();if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const v=parseFloat(s);if(!(v>0))return;tx.push({id:Date.now(),type:"e",amount:Math.round(v*100)/100,cat:"Gastos fixos",date:mes==hoje().slice(0,7)?hoje():mes+"-01",desc:f.name,fixId:f.id});save();render()});
  document.querySelectorAll(".fd").forEach(b=>b.onclick=()=>{if(confirm("Parar de repetir este gasto fixo nos próximos meses?")){fix=fix.filter(f=>f.id!=b.dataset.id);save2();render()}});
  $("t1").className=aba==1?"on":"";$("t2").className=aba==2?"on":"";$("t3").className=aba==3?"on":"";
}
function shift(n){const [y,m]=mes.split("-").map(Number),d=new Date(y,m-1+n,1);mes=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}
function setTipo(t){tipo=t;$("bE").className="e"+(t=="e"?" on":"");$("bI").className="i"+(t=="i"?" on":"");
  $("cat").innerHTML=Object.keys(CATS[t]).map(k=>`<option>${k}</option>`).join("");
  $("srcw").hidden=t!="i";fillSrc();togFx()}
function fillSrc(){$("src").innerHTML=`<option value="">Sem empresa</option>`+srcs.map(s=>`<option>${esc(s)}</option>`).join("")+`<option value="__new">+ Nova empresa…</option>`}
function togFx(){$("fxh").hidden=!(tipo=="e"&&$("cat").value=="Gastos fixos")}
$("cat").onchange=togFx;
$("src").onchange=()=>{if($("src").value=="__new"){const n=(prompt("Nome da empresa:")||"").trim();if(n&&!srcs.includes(n)){srcs.push(n);save2()}fillSrc();$("src").value=n||""}};
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
$("t1").onclick=()=>{aba=1;render()};$("t2").onclick=()=>{aba=2;render()};$("t3").onclick=()=>{aba=3;render()};
$("bE").onclick=()=>setTipo("e");$("bI").onclick=()=>setTipo("i");
$("fab").onclick=()=>{setTipo("e");$("val").value="";$("ds").value="";$("dt").value=hoje();$("dlg").showModal()};
$("cancelar").onclick=()=>$("dlg").close();
$("salvar").onclick=()=>{
  const v=parseFloat($("val").value);
  if(!(v>0)){$("val").focus();return}
  const o={id:Date.now(),type:tipo,amount:Math.round(v*100)/100,cat:$("cat").value,date:$("dt").value||hoje(),desc:$("ds").value.trim()};
  if(tipo=="i"&&$("src").value)o.src=$("src").value;
  if(tipo=="e"&&o.cat=="Gastos fixos"){if(!o.desc){$("ds").focus();alert("Dê um nome ao gasto fixo (ex.: Energia).");return}
    const f={id:o.id,name:o.desc,start:o.date.slice(0,7)};fix.push(f);save2();o.fixId=f.id}
  tx.push(o);
  save();mes=(tx[tx.length-1].date).slice(0,7);$("dlg").close();render();
};
const MODELS=["gemini-2.5-flash","gemini-3-flash-preview"];
const ACT=`Se o usuário informar um recebimento ou gasto para registrar (ex.: "recebi 1000 da empresa X", "paguei 180 de energia"), NÃO diga que já foi registrado: responda com uma frase curta descrevendo o que será lançado e, na última linha, escreva exatamente LANCAMENTOS: seguido de um array JSON, sem nenhum texto depois. Cada item: {"tipo":"receita" ou "despesa","valor":número com ponto decimal,"categoria":uma das categorias_validas do tipo,"empresa":nome da empresa (só receita, opcional; use o nome exato de empresas_cadastradas quando coincidir),"data":"AAAA-MM-DD" (use a data de hoje se não informada),"descricao":texto curto,"fixo":true se for gasto fixo mensal (energia, água, cartão etc.)}. O app pede a confirmação do usuário antes de salvar. Se faltar o valor, pergunte em vez de lançar. Para perguntas e análises, nunca use LANCAMENTOS.`;
const SYS="Você é o assistente financeiro do app Minhas Finanças. Responda em português do Brasil, de forma curta, clara e prática. Use somente os dados JSON fornecidos; se faltar informação, diga o que falta. Não invente números. Valores em reais (R$). Mês no formato AAAA-MM. Gastos fixos pendentes ainda não têm valor lançado no mês. Dê sugestões úteis de economia quando fizer sentido, sem afirmar que é consultoria financeira profissional.\n"+ACT;
let msgs=[],draft="",busy=false,aiMods=null;
function ctx(){
  const m={};
  tx.forEach(t=>{const k=t.date.slice(0,7);m[k]=m[k]||{receitas:0,despesas:0,receitas_por_fonte:{},despesas_por_categoria:{}};
    if(t.type=="i"){m[k].receitas+=t.amount;const f=t.src||t.cat;m[k].receitas_por_fonte[f]=(m[k].receitas_por_fonte[f]||0)+t.amount}
    else{m[k].despesas+=t.amount;m[k].despesas_por_categoria[t.cat]=(m[k].despesas_por_categoria[t.cat]||0)+t.amount}});
  const ks=Object.keys(m).sort().slice(-12);
  return JSON.stringify({hoje:hoje(),mes_selecionado:mes,resumo_por_mes:Object.fromEntries(ks.map(k=>[k,m[k]])),
    lancamentos_do_mes_selecionado:tx.filter(t=>t.date.startsWith(mes)).map(t=>({data:t.date,tipo:t.type=="i"?"receita":"despesa",valor:t.amount,categoria:t.cat,empresa:t.src,descricao:t.desc})),
    categorias_validas:{receita:Object.keys(CATS.i),despesa:Object.keys(CATS.e)},empresas_cadastradas:srcs,gastos_fixos:fix.map(f=>({nome:f.name,desde:f.start,pendente_no_mes_selecionado:f.start<=mes&&!tx.some(t=>t.fixId==f.id&&t.date.startsWith(mes))}))});
}
function chatHtml(){
  const fd=d=>(/^\d{4}-\d{2}-\d{2}$/.test(d)?d:hoje()).split("-").reverse().join("/");
  const act=(m,i)=>m.acao?`<div class="msg m" style="border-color:var(--pri)"><b>Confirmar lançamento?</b>${m.acao.map(x=>`<div style="margin-top:6px">${x.tipo=="receita"?"💰 Receita":"🧾 Despesa"} · <b>${brl(Number(x.valor))}</b> · ${esc(String(x.empresa||x.categoria||""))}${x.fixo?" · fixo":""} · ${fd(x.data)}${x.descricao?"<br><span class='mut'>"+esc(String(x.descricao))+"</span>":""}</div>`).join("")}<div style="margin-top:10px"><button class="save cf" data-i="${i}" style="width:auto;margin:0;padding:8px 14px">Confirmar</button> <button class="sg cc" data-i="${i}">Cancelar</button></div></div>`:"";
  const body=msgs.map((m,i)=>`<div class="msg ${m.r}">${esc(m.t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")}</div>`+act(m,i)).join("");
  return `<div class="card"><b>Assistente</b><div class="mut">Pergunte sobre seus gastos, receitas e fixos. Os dados enviados são só resumos e os lançamentos do mês selecionado.</div>
  <div id="msgs">${body}</div>
  <div>${["Faça um resumo deste mês","Onde posso economizar?","Quanto recebi de cada empresa?"].map(x=>`<button class="sg">${x}</button>`).join("")}</div>
  <div style="display:flex;gap:8px;margin-top:10px"><input id="q" placeholder="Pergunte ou lance: recebi R$ 1.000 da empresa X"><button id="go" class="save" style="width:auto;margin:0;padding:0 16px">Enviar</button></div></div>`;
}
function bindChat(){
  const q=$("q");q.value=draft;q.oninput=()=>draft=q.value;
  q.onkeydown=e=>{if(e.key=="Enter")send()};
  $("go").onclick=send;
  document.querySelectorAll(".cf").forEach(b=>b.onclick=()=>{const m=msgs[b.dataset.i];m.acao.forEach(commit);save();m.t+="\n\n✅ Lançamento registrado.";m.acao=null;render()});
  document.querySelectorAll(".cc").forEach(b=>b.onclick=()=>{const m=msgs[b.dataset.i];m.t+="\n\n❎ Cancelado.";m.acao=null;render()});
  document.querySelectorAll(".sg").forEach(b=>b.onclick=()=>{q.value=b.textContent;send()});
  const m=$("msgs");m.scrollTop=m.scrollHeight;
}
function parseAct(t){
  const i=t.indexOf("LANCAMENTOS:");if(i<0)return {t,acao:null};
  const txt=t.slice(0,i).replace(/```\w*\s*$/,"").trim(),raw=t.slice(i+12);
  try{
    const arr=JSON.parse(raw.slice(raw.indexOf("["),raw.lastIndexOf("]")+1));
    const ok=arr.filter(x=>x&&Number(x.valor)>0&&(x.tipo=="receita"||x.tipo=="despesa"));
    return {t:txt||"Confirme o lançamento abaixo:",acao:ok.length?ok:null};
  }catch(e){return {t:txt||t,acao:null}}
}
function commit(it){
  const ty=it.tipo=="receita"?"i":"e";
  let cat=CATS[ty][it.categoria]?it.categoria:(ty=="i"?"Salário":"Outros");
  if(ty=="e"&&it.fixo)cat="Gastos fixos";
  const o={id:Date.now()+Math.floor(Math.random()*1000),type:ty,amount:Math.round(Number(it.valor)*100)/100,cat,date:/^\d{4}-\d{2}-\d{2}$/.test(it.data)?it.data:hoje(),desc:String(it.descricao||"").trim()};
  if(ty=="i"&&it.empresa){const e=String(it.empresa).trim();let n=srcs.find(x=>x.toLowerCase()==e.toLowerCase());if(!n&&e){n=e;srcs.push(n)}if(n)o.src=n}
  if(cat=="Gastos fixos"){
    o.desc=o.desc||"Gasto fixo";
    const f=fix.find(x=>x.name.toLowerCase()==o.desc.toLowerCase());
    if(!f){const nf={id:o.id,name:o.desc,start:o.date.slice(0,7)};fix.push(nf);o.fixId=nf.id}
    else if(!tx.some(t=>t.fixId==f.id&&t.date.slice(0,7)==o.date.slice(0,7)))o.fixId=f.id;
  }
  tx.push(o);
}
async function send(){
  const text=$("q").value.trim();if(!text||busy)return;
  busy=true;draft="";msgs.push({r:"u",t:text},{r:"m",t:"Pensando…"});render();
  try{const r=parseAct(await askAI(text)),m=msgs[msgs.length-1];m.t=r.t;m.acao=r.acao}
  catch(e){msgs.splice(-2);draft=text;alert("Não consegui falar com o Gemini: "+(e.message||e))}
  busy=false;render();
}
async function askAI(text){
  if(!aiMods){
    const V="https://www.gstatic.com/firebasejs/12.0.0/";
    const [a,i]=await Promise.all([import(V+"firebase-app.js"),import(V+"firebase-ai.js")]);
    aiMods={i,ai:i.getAI(a.initializeApp(firebaseConfig,"ai"),{backend:new i.GoogleAIBackend()})};
  }
  const hist=msgs.slice(0,-2).map(m=>({role:m.r=="u"?"user":"model",parts:[{text:m.t}]}));
  let err;
  for(const name of MODELS){
    try{
      const cfg=name=="gemini-2.5-flash"?{thinkingConfig:{thinkingBudget:0}}:undefined;
      const model=aiMods.i.getGenerativeModel(aiMods.ai,{model:name,systemInstruction:SYS+"\nDADOS (JSON):\n"+ctx(),generationConfig:cfg});
      const res=await model.startChat({history:hist}).sendMessage(text);
      return res.response.text();
    }catch(e){err=e;if(!/404|not found|not supported|deprecat|retired/i.test(e.message||""))break}
  }
  throw err;
}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
if(firebaseConfig.apiKey.startsWith("COLE")){$("lmsg").textContent="Preencha o arquivo firebase-config.js com os dados do seu projeto Firebase.";$("entrar").hidden=true}
else{
  const app=initializeApp(firebaseConfig),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()});
  $("entrar").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{$("lmsg").textContent="Erro no login: "+e.code});
  $("sair").onclick=()=>signOut(auth);
  onAuthStateChanged(auth,u=>{
    if(unsub){unsub();unsub=null}
    $("login").hidden=!!u;$("app").hidden=!u;
    if(!u){ref=null;return}
    ref=doc(db,"users",u.uid,"data","main");
    unsub=onSnapshot(ref,sn=>{
      if(sn.exists()){const d=sn.data();tx=d.tx||[];srcs=d.srcs||[];fix=d.fix||[]}
      else if(tx.length||srcs.length||fix.length)push();
      render();
    });
  });
}
</script>
